<!DOCTYPE html>
<html>

<head>
    <style>
        /* Set a dark background for the page */
        body {
            background-color: #797979;
        }

        /* Stop the browser's own scroll/zoom/selection gestures from
           competing with a finger tracing across the keyboard */
        svg {
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Base look of every hexagon key. These properties live here rather
           than on the shared <polygon> in <defs> so they're inherited
           per <use> instance, which lets .active below recolor just one
           key at a time. */
        svg use[href="#Hexagon"] {
            fill: none;
            stroke: #888;
            pointer-events: visible;
        }

        /* Highlight for whichever hexagon a pointer is currently over.
           Stroke is left unchanged (only fill lightens) because adjacent
           hexagons share edges: a bolder stroke on just one of them makes
           whichever hexagon comes later in the SVG's paint order win at
           that shared edge, which looked inconsistent. */
        svg use[href="#Hexagon"].active {
            fill: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <!-- SVG Section: Renders the hexagon tiling and note shapes -->
    <svg id="keyboard" viewBox="0 0 400 500">
        <!-- this current section from https://commons.wikimedia.org/wiki/File:Hexagon_Tiling.svg -->
        <!-- CC-BY-SA Apocheir -->
        <defs>
            <g id="Hexagon">
                <!-- fill/stroke/pointer-events are set in the <style> block on
                     use[href="#Hexagon"] instead of here, so they're inherited
                     per <use> instance and can be overridden individually
                     (e.g. by .active) rather than fixed for every hexagon -->
                <polygon points="
                0,-57.73502692
                50,-28.86751346
                50,28.86751346
                0, 57.73502692
                -50,28.86751346
                -50,-28.86751346 " />
            </g>
        </defs>

        <path class="Note" fill="#5728a4" transform="translate(100 413.3974596) scale(2) translate(-17.8 0)"
            d="M17.9063,-12.5 L0,12.5 L35.6094,12.5 L17.9063,-12.5 " />
        <use id="do4" href="#Hexagon" transform="translate(100 413.3974596)" />

            d="M0,-12.5 L0,-1.70313 C0,2.79688 2.70313,12.5 18,12.5 C33.4063,12.5 36.1094,2.59375 36.1094,-1.70313 L36.1094,-12.5 L0,-12.5 " />

            d="M36,12.5 L36,-12.5 L0,-12.5 L36,12.5 " />
        <use id="fa4" href="#Hexagon" transform="translate(50 326.7949192)" />

            d="M0,-12.5 L0,-1.70313 C0,2.79688 2.70313,12.5 18,12.5 C33.4063,12.5 36.1094,2.59375 36.1094,-1.70313 L36.1094,-12.5 L0,-12.5 " />
        <use id="re5" href="#Hexagon" transform="translate(200 240.1923789)" />
        <path class="Note" fill="#ed6f00" transform="translate(300 240.1923789) scale(2) translate(-17.8 0)"
            d="M18.2969,-13.7031 L0,0 L17.7031,13.7969 L36.1094,0 L18.2969,-13.7031 " />

            d="M36,12.5 L36,-12.5 L0,-12.5 L36,12.5 " />

            d="M0,4.70313 C0,10.4063 5.29688,13.7969 12,13.7969 C23,13.7969 36.4063,4.79688 36.4063,-4.70313 C36.4063,-10.2969 31.4063,-13.7969 24.4063,-13.7969 C10.9063,-13.7969 0,-4.90625 0,4.70313" />

            d="M17.7969,12.5 L35.6094,-4.29688 C31.2969,-9.40625 24.9063,-12.5 17.7969,-12.5 C10.7031,-12.5 4.29688,-9.40625 0,-4.29688 L17.7969,12.5 " />

        <path class="Note" fill="#be006a" transform="translate(200 66.98729811) scale(2) translate(-17.8 0)"
            d="M0,-12.5 L0,-1.70313 C0,2.79688 2.70313,12.5 18,12.5 C33.4063,12.5 36.1094,2.59375 36.1094,-1.70313 L36.1094,-12.5 L0,-12.5 " />
        <use id="re6" href="#Hexagon" transform="translate(200 66.98729811)" />
        <path class="Note" fill="#ed6f00" transform="translate(300 66.98729811) scale(2) translate(-17.8 0)"
            d="M18.2969,-13.7031 L0,0 L17.7031,13.7969 L36.1094,0 L18.2969,-13.7031 " />

    <!-- Load external libraries for WebAudioFont -->
    <script src='https://surikov.github.io/webaudiofont/npm/dist/WebAudioFontPlayer.js'></script>
    <script src='https://surikov.github.io/webaudiofontdata/sound/0000_JCLive_sf2_file.js'></script>
    <script>
        // Initialize Web Audio API and the audio player
        const selectedPreset = _tone_0000_JCLive_sf2_file;
        const AudioContextFunc = window.AudioContext || window.webkitAudioContext;
        const audioContext = new AudioContextFunc();
        const player = new WebAudioFontPlayer();

        // Note pitch offsets for solfa notation
        const doe = 0, ra = 1, re = 2, ma = 3, mi = 4, fa = 5, fi = 6, so = 7, lo = 8, la = 9, ta = 10, ti = 11;

        // Page options come from the URL, e.g. ?start=D3
        const params = new URLSearchParams(window.location.search);

        // Converts a note name like C3, Eb3 or Fs2 (s = sharp, since # in a
        // URL starts an anchor) to a MIDI number, using C4 = middle C = 60.
        // Returns null if the name isn't recognised.
        function parseNoteName(name) {
            const match = /^([A-G])(#|s|b)?(\d)$/i.exec(name || '');
            if (!match) return null;
            const semitones = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
            const accidental = { '#': 1, s: 1, b: -1 }[match[2]?.toLowerCase()] || 0;
            const octave = parseInt(match[3]);
            return 12 * (octave + 1) + semitones[match[1].toUpperCase()] + accidental;
        }

        // MIDI pitch of the bottom-left "do" hexagon; defaults to C3
        const startMidi = parseNoteName(params.get('start')) ?? 48;

        // Adjust the preset volume settings before playing notes
        player.adjustPreset(audioContext, selectedPreset);

        // ?sustain=on works like a piano's sustain pedal: notes ring for a
        // fixed time instead of stopping when the finger lifts.
        const sustainOn = params.get('sustain') === 'on';
        const SUSTAIN_NOTE_SECONDS = 4;

        // Upper bound on a note's length in case a release event is ever
        // missed; normally the note is cancelled when the pointer lets go.
        const MAX_NOTE_SECONDS = 60;

        // Play a note using the selected preset. Returns the WebAudioFont
        // envelope, whose cancel() fades the note out.
        // octave counts up from 4 for the bottom row of hexagons.
        function playSolfa(pitch, octave) {
            return player.queueWaveTable(
                audioContext,
                audioContext.destination,
                selectedPreset,
                audioContext.currentTime,
                startMidi + pitch + 12 * (octave - 4),
                sustainOn ? SUSTAIN_NOTE_SECONDS : MAX_NOTE_SECONDS
            );
        }

        // Note metadata for every hexagon key, looked up by the <use> element's id
        const noteDefs = [
            ['do4', doe, 4], ['re4', re, 4], ['mi4', mi, 4],
            ['fa4', fa, 4], ['so4', so, 4], ['la4', la, 4], ['ti4', ti, 4],
            ['do5', doe, 5], ['re5', re, 5], ['mi5', mi, 5],
            ['fa5', fa, 5], ['so5', so, 5], ['la5', la, 5], ['ti5', ti, 5],
            ['do6', doe, 6], ['re6', re, 6], ['mi6', mi, 6],
        ];
        const noteMap = new Map(
            noteDefs.map(([id, pitch, octave]) => [id, { pitch, octave }])
        );

        const svgEl = document.getElementById('keyboard');

        // Tracks, per pointerId (one entry per finger or the mouse), which
        // hexagon <use> element that pointer is currently over.
        const activeHexByPointer = new Map();

        // Tracks, per pointerId, the envelope of the note that pointer is
        // currently sounding, so it can be stopped when the pointer leaves.
        const envelopeByPointer = new Map();

        // elementFromPoint() is expected to resolve straight to the
        // <use id="..."> under the pointer, but walk up parentElement
        // defensively in case something else is returned.
        function resolveNoteElement(el) {
            while (el instanceof Element) {
                if (noteMap.has(el.id)) return el;
                el = el.parentElement;
            }
            return null;
        }

        function playHex(hexEl) {
            const note = noteMap.get(hexEl.id);
            return playSolfa(note.pitch, note.octave);
        }

        function stopNote(pointerId) {
            const envelope = envelopeByPointer.get(pointerId);
            if (envelope && !sustainOn) envelope.cancel();
            envelopeByPointer.delete(pointerId);
        }

        // Updates which hex is highlighted for a pointer, removing the
        // highlight from whatever it was previously over (if anything).
        function setActiveHex(pointerId, hexEl) {
            const previous = activeHexByPointer.get(pointerId);
            if (previous) previous.classList.remove('active');
            if (hexEl) hexEl.classList.add('active');
            activeHexByPointer.set(pointerId, hexEl || null);
        }

        // pointerdown: start tracking this pointer (mouse button or finger).
        // If it landed on a key, play it and highlight it.
        function handlePointerDown(event) {
            event.preventDefault();
            // Keep receiving move/up events for this pointer even if it
            // drags outside the SVG's own bounds.
            svgEl.setPointerCapture(event.pointerId);
            const hexEl = resolveNoteElement(
                document.elementFromPoint(event.clientX, event.clientY)
            );
            setActiveHex(event.pointerId, hexEl);
            if (hexEl) envelopeByPointer.set(event.pointerId, playHex(hexEl));
        }

        // pointermove: only matters for pointers we're already tracking.
        // Re-hit-test at the current position; if it's now over a different
        // hex than before (including moving into/out of a gap between keys),
        // stop the old note, move the highlight, and start the new key's
        // note if it's landed on one.
        function handlePointerMove(event) {
            if (!activeHexByPointer.has(event.pointerId)) return;
            event.preventDefault();
            const hexEl = resolveNoteElement(
                document.elementFromPoint(event.clientX, event.clientY)
            );
            const current = activeHexByPointer.get(event.pointerId);
            if (hexEl === current) return;
            stopNote(event.pointerId);
            setActiveHex(event.pointerId, hexEl);
            if (hexEl) envelopeByPointer.set(event.pointerId, playHex(hexEl));
        }

        // pointerup/pointercancel: stop this pointer's note, clear its
        // highlight, and stop tracking it.
        function handlePointerUp(event) {
            stopNote(event.pointerId);
            const previous = activeHexByPointer.get(event.pointerId);
            if (previous) previous.classList.remove('active');
            activeHexByPointer.delete(event.pointerId);
        }

        svgEl.addEventListener('pointerdown', handlePointerDown, { passive: false });
        svgEl.addEventListener('pointermove', handlePointerMove, { passive: false });
        svgEl.addEventListener('pointerup', handlePointerUp);
        svgEl.addEventListener('pointercancel', handlePointerUp);

        // preventDefault() on pointerdown doesn't cancel touch gestures, so
        // block them here: long-press (Android haptic buzz) and the
        // two-finger-tap right-click menu (Windows).
        svgEl.addEventListener('touchstart', (event) => event.preventDefault(), { passive: false });
        svgEl.addEventListener('contextmenu', (event) => event.preventDefault());

    </script>
</body>

</html>
